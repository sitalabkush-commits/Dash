<!doctype html><html lang=bn><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Context + Zone Checker</title>
<style>
body{margin:0;background:#0e1116;color:#e6e8ec;font:15px system-ui,sans-serif;max-width:560px;margin:auto;padding:10px}
.card{background:#171b22;border:1px solid #262c36;border-radius:12px;padding:12px;margin:10px 0}
.big{font-size:34px;font-weight:700;margin:4px 0}.mut{color:#8b93a1}.red{color:#f6465d}.warn{border-color:#f0b90b;color:#f0b90b}
.row{display:flex;gap:6px;margin:8px 0}.row input{flex:1;min-width:0}input,button{background:#0e1116;color:#e6e8ec;border:1px solid #333b47;border-radius:8px;padding:8px}
.row2{display:grid;grid-template-columns:1.4fr 1.2fr .9fr .5fr;gap:4px;padding:6px 0;border-top:1px solid #222;font-size:13px}
.w{width:52px;padding:2px 4px;margin-left:4px}summary{cursor:pointer}
#flash{display:none;position:sticky;top:0;background:#f0b90b;color:#000;padding:8px;border-radius:8px;z-index:9}
.hm{display:flex;align-items:center;gap:4px;font-size:11px;margin:2px 0}.hm span{width:50px}.hm i{height:10px;display:block}.hm em{color:#8b93a1;font-style:normal}
table{width:100%;font-size:13px;border-collapse:collapse}td{padding:4px;border-top:1px solid #222}
</style></head><body><div id=flash></div><div class=mut id=st></div><div id=app></div>
<p class=mut style="font-size:12px">শুধু তথ্য-সহায়ক টুল, ট্রেডের পরামর্শ নয়।</p>
<script src=engine.js></script><script src=options.js></script><script src=heatmap.js></script><script src=ui.js></script></body></html>
